# The jpl-queue Worker (#100): hosts the JplQueue Durable Object that serialises every
# on-demand JPL request. Deployed on its own (not by Pages):
#   pnpm exec wrangler deploy --config workers/jpl-queue/wrangler.toml
# The Pages project binds to it with script_name = "observatory-jpl-queue".
name = "observatory-jpl-queue"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# Reachable only through the binding: no workers.dev address, no routes.
workers_dev = false
preview_urls = false

[[durable_objects.bindings]]
name = "JPL_QUEUE"
class_name = "JplQueue"

# The Workers Free plan offers only SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["JplQueue"]
