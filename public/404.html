<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found · Observatory</title>
    <meta name="description" content="There is no page at this address. Observatory has five views: Earth, Orrery, Sun, Sky and Orbit." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#030101" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/ibm-plex-mono-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Self-contained: this page is served for any unknown path, so it cannot rely on the app's
         bundle or on relative URLs. Colours are the tokens in src/styles/tokens.css, approximated in hex (no tokens here). */
      @font-face {
        font-family: 'IBM Plex Mono';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/ibm-plex-mono-400-latin.woff2') format('woff2');
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #030101;
        color: #a9a49c;
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 0.875rem;
        letter-spacing: 0.05em;
        line-height: 1.6;
      }
      main {
        max-width: 34rem;
        text-align: center;
      }
      .code {
        margin: 0;
        color: #c46b39;
        font-size: 3rem;
        letter-spacing: 0.18em;
      }
      h1 {
        margin: 0 0 12px;
        color: #c46b39;
        font-size: 1.1rem;
        font-weight: 400;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      p {
        margin: 0 0 20px;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px 20px;
      }
      a {
        color: #c46b39;
        padding: 6px 4px;
      }
      a:hover,
      a:focus-visible {
        color: #e8e2d8;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <h1>Nothing at this address</h1>
      <p>Observatory has five views, each with its own address. Pick one.</p>
      <nav aria-label="Views">
        <a href="/">Earth</a>
        <a href="/orrery/">Orrery</a>
        <a href="/sun/">Sun</a>
        <a href="/sky/">Sky</a>
        <a href="/orbit/">Orbit</a>
      </nav>
    </main>
  </body>
</html>
