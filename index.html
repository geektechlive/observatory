<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Observatory: live ISS tracker, 3D orrery and space weather</title>
    <meta name="description" content="Live NASA and NOAA data: track the ISS, explore a 3D orrery of planets and spacecraft, follow near-Earth asteroids, quakes, fires and the live Sun." />
    <!-- --void from src/styles/tokens.css, as hex (#110) -->
    <meta name="theme-color" content="#030101" />
    <link rel="canonical" href="https://observatory.geektechlive.com/" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <!-- Share preview (#110). The image is built by scripts/og-image.mjs; regenerate it
         after a visual change. tests/unit/share-meta.test.ts keeps og and twitter in step. -->
    <meta property="og:site_name" content="Observatory" />
    <meta property="og:title" content="Observatory: live NASA and NOAA data, from Earth to the heliopause" />
    <meta property="og:description" content="Five views on one instrument. Earth: the ISS live, quakes, fires and aurora. Orrery: the planets, Voyagers and New Horizons in 3D. Sun: today's Sun from SDO, flares and the solar wind. Sky: tonight's planets and passing asteroids. Orbit: who's in space, Deep Space Network contacts and launches." />
    <meta property="og:url" content="https://observatory.geektechlive.com" />
    <meta property="og:image" content="https://observatory.geektechlive.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Observatory: a copper globe lit by the Sun, with city lights on its night side" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Observatory: live NASA and NOAA data, from Earth to the heliopause" />
    <meta name="twitter:description" content="Five views on one instrument. Earth: the ISS live, quakes, fires and aurora. Orrery: the planets, Voyagers and New Horizons in 3D. Sun: today's Sun from SDO, flares and the solar wind. Sky: tonight's planets and passing asteroids. Orbit: who's in space, Deep Space Network contacts and launches." />
    <meta name="twitter:image" content="https://observatory.geektechlive.com/og-image.png" />
    <meta name="twitter:image:alt" content="Observatory: a copper globe lit by the Sun, with city lights on its night side" />

    <!-- Self-hosted font preloads (critical weights only) -->
    <link rel="preload" href="/fonts/inter-tight-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-mono-400-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- No Earth texture preloads here: this file can't see the hash, and a desktop #orrery,
         #sun or #sky would download them for nothing (#173). main.tsx asks by view. -->
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div id="root"></div>
    <noscript>
      <style>
        .noscript {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          min-height: 100dvh;
          /* --void and --bone-dim as hex; no tokens before the app's CSS loads */
          background: #030101;
          color: #a9a49c;
          font-family: 'IBM Plex Mono', ui-monospace, monospace;
          font-size: 0.875rem;
          letter-spacing: 0.05em;
          text-align: center;
          gap: 12px;
        }
        .noscript-title {
          color: #c46b39;
          font-size: 1.1rem;
          letter-spacing: 0.18em;
          text-transform: uppercase;
        }
      </style>
      <div class="noscript">
        <span class="noscript-title">Observatory</span>
        <span>JavaScript is required to display live NASA data.</span>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
