<!doctype html>
<!-- The 1200x630 share card (#110), rendered by scripts/og-image.mjs. "One lens, one
     line": the copper globe on void, the painted ship name, one sentence and a credit.
     {{ROOT}} and {{GLOBE}} are file URLs filled in by the script. Colours come from
     tokens.css; type follows roci-retrofit-v2 section 3. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="{{ROOT}}/src/styles/tokens.css" />
    <style>
      @font-face {
        font-family: 'Special Elite';
        src: url('{{ROOT}}/public/fonts/special-elite-latin.woff2') format('woff2');
      }

      @font-face {
        font-family: 'IBM Plex Mono';
        src: url('{{ROOT}}/public/fonts/ibm-plex-mono-500-latin.woff2') format('woff2');
        font-weight: 500;
      }

      @font-face {
        font-family: 'Fraunces';
        src: url('{{ROOT}}/public/fonts/fraunces-italic-latin.woff2') format('woff2');
        font-style: italic;
        font-weight: 100 900;
      }

      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--void);
      }

      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: radial-gradient(circle 460px at 912px 315px, oklch(0.13 0.02 55), var(--void));
      }

      /* The lens: globe and bezel as captured, centred on (912, 315). closest-side keeps
         the outer lip whole. */
      .lens {
        position: absolute;
        left: 672px;
        top: 75px;
        width: 480px;
        height: 480px;
        background: url('{{GLOBE}}') center / contain no-repeat;
        mask-image: radial-gradient(circle closest-side, #000 99%, transparent 100%);
      }

      .name,
      .voice,
      .rule,
      .credit {
        position: absolute;
        left: 72px;
        margin: 0;
      }

      .name {
        top: 196px;
        font-family: var(--font-paint);
        font-size: 80px;
        font-weight: 400;
        line-height: 80px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--copper);
      }

      .voice {
        top: 300px;
        font-family: var(--font-display);
        font-style: italic;
        font-weight: 300;
        font-size: 38px;
        line-height: 44px;
        white-space: nowrap;
        color: var(--bone);
      }

      .rule {
        top: 372px;
        width: 64px;
        height: 1px;
        background: var(--copper-2);
      }

      .credit {
        top: 392px;
        font-family: var(--font-mono);
        font-weight: 500;
        font-size: 20px;
        line-height: 26px;
        letter-spacing: var(--track-label);
        color: var(--bone-faint);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="lens"></div>
      <h1 class="name">Observatory</h1>
      <p class="voice">From Earth to the heliopause, live.</p>
      <div class="rule"></div>
      <p class="credit">NASA · NOAA · JPL Horizons</p>
    </div>
  </body>
</html>
