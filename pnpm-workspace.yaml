# Not a workspace definition — pnpm 10 reads several settings from this file,
# and minimumReleaseAgeExclude is one of them (the `pnpm` field in package.json
# is not consulted for it).
#
# Dependabot runs its helper with --config.minimumReleaseAge=4320, a 3-day
# supply-chain cooldown. pnpm applies that to the WHOLE dependency graph, not
# just the package being bumped, so a single freshly-published transitive
# package aborts the entire resolution:
#
#   ERR_PNPM_NO_MATURE_MATCHING_VERSION  Version 1.2.8 (released 35 hours ago)
#   of @rolldown/binding-linux-s390x-gnu does not meet the minimumReleaseAge
#
# That is what failed the 2026-09-10 Dependabot run. It was reported against
# @types/node, which was merely the dependency being processed at the time and
# had nothing to do with the cause.
#
# The entries below are platform-specific native binaries that are published in
# lockstep with their parent package, so holding them to a separate maturity
# window buys nothing the parent's own cooldown does not already provide. The
# cooldown still applies to every ordinary dependency.
#
# Only `@scope/*` patterns and exact names are supported — partial-name globs
# such as `lightningcss-*` are not. If an unscoped platform binary trips this
# again, add it by exact name.
minimumReleaseAgeExclude:
  - '@rolldown/*'
  - '@cloudflare/*'
  - '@esbuild/*'
  - '@img/*'
  - rolldown
  - esbuild
  - lightningcss
  - workerd
